[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "krgenesis-mod"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["nicegui[native]", "psutil", "Pillow"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
include = ["krmod*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
# LuaJIT raises Win64 SEH exceptions for Lua errors; it handles them itself, but
# faulthandler would dump a bogus "fatal exception" traceback for each one.
addopts = "-p no:faulthandler"
